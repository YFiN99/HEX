<svg viewBox="0 0 150 65" width="150" height="65" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="100%" stop-color="#3fa8d8"/>
    </linearGradient>
  </defs>

  <!-- ============================================================
        MARK: 9 Full Arrows in a circle with Rose Center
  ============================================================ -->
  <g transform="translate(75, 21) scale(0.26)" filter="url(#glow)" stroke="url(#cartGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- One full arrow pointing up -->
    <g id="full-arrow">
      <!-- shaft -->
      <line x1="0" y1="-22" x2="0" y2="-98" stroke-width="2.2"/>
      
      <!-- arrowhead -->
      <path d="M 0,-98 L -8,-83 L 0,-88 L 8,-83 Z" fill="url(#cartGrad)" stroke-width="2"/>
      
      <!-- fletching -->
      <path d="M 0,-22 
               C -9,-10 -14,-12 -8,-22
               C -14,-14 -9,-8 0,-24" stroke-width="1.7"/>
      <path d="M 0,-22 
               C 9,-10 14,-12 8,-22
               C 14,-14 9,-8 0,-24" stroke-width="1.7"/>
    </g>

    <!-- 9 arrows rotated by 40 degrees each -->
    <use href="#full-arrow" transform="rotate(0)"/>
    <use href="#full-arrow" transform="rotate(40)"/>
    <use href="#full-arrow" transform="rotate(80)"/>
    <use href="#full-arrow" transform="rotate(120)"/>
    <use href="#full-arrow" transform="rotate(160)"/>
    <use href="#full-arrow" transform="rotate(200)"/>
    <use href="#full-arrow" transform="rotate(240)"/>
    <use href="#full-arrow" transform="rotate(280)"/>
    <use href="#full-arrow" transform="rotate(320)"/>

    <!-- Outer ring surrounding the rose -->
    <circle cx="0" cy="0" r="44" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" stroke-width="1" opacity="0.7"/>

    <!-- Rose Graphic Center -->
    <g transform="translate(0,0) scale(0.7)" stroke="url(#cartGrad)" stroke-width="2" fill="none">
      <path d="M 0,15 C -15,10 -25,-5 -15,-20 C -20,-30 -10,-40 0,-35 C 10,-40 20,-30 15,-20 C 25,-5 15,10 0,15 Z" />
      <path d="M 0,5 C -10,0 -15,-10 -10,-20 C -12,-28 -5,-32 0,-28 C 5,-32 12,-28 10,-20 C 15,-10 10,0 0,5 Z" />
      <path d="M 0,-5 C -5,-8 -8,-12 -5,-18 C -2,-22 2,-22 5,-18 C 8,-12 5,-8 0,-5 Z" />
      <path d="M 0,-10 C -2,-12 -3,-15 0,-18 C 3,-15 2,-12 0,-10 Z" />
      <path d="M -15,-20 C -25,-25 -35,-15 -30,-2 C -25,10 -10,15 0,15" />
      <path d="M 15,-20 C 25,-25 35,-15 30,-2 C 25,10 10,15 0,15" />
      <path d="M -10,20 C -5,25 5,25 10,20" />
      <path d="M 0,15 L 0,28" stroke-width="2.5" />
      <path d="M -4,22 L 0,26 L 4,22" />
    </g>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#eafcff" stroke="none"/>
  </g>

  <!-- HEX wordmark (posisi y diturunkan lagi ke 62 agar lebih pas ke bawah, logo sedikit dinaikkan) -->
  <text x="75" y="62" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="500"
        letter-spacing="4"
        fill="#14C8FF"
        filter="url(#glow)">
      HEX
  </text>
</svg>
